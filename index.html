<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Droste Cam</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <div class="controls-header">
      <h1>Droste Cam</h1>
      <div class="controls-buttons">
        <button id="btn-toggle-cam" title="Start/Stop Camera">
          <span id="cam-icon">&#9673;</span>
        </button>
        <button id="btn-toggle-anim" title="Pause/Resume Animation">
          <span id="anim-icon">&#10074;&#10074;</span>
        </button>
        <button id="btn-toggle-grid" title="Toggle Grid (G)">
          <span id="grid-icon">&#9638;</span>
        </button>
      </div>
    </div>

    <div class="select-group">
      <label>Camera</label>
      <select id="camera-select">
        <option value="">Loading cameras...</option>
      </select>
    </div>

    <div class="geometry-group">
      <label>Geometry <span id="val-geometry">1, -1</span></label>
      <div class="geometry-pad" id="geometry-pad">
        <canvas id="geometry-canvas" width="200" height="200"></canvas>
        <div class="geometry-point" id="geometry-point"></div>
      </div>
    </div>

    <div class="slider-group">
      <label>Zoom <span id="val-zoom">0.30</span></label>
      <input type="range" id="zoomSpeed" min="0" max="2.0" step="0.01" value="0.30" />
    </div>

    <div class="spring-section">
      <label class="section-label">Spring</label>
      <div class="slider-group">
        <label>Stiffness <span id="val-stiffness">120</span></label>
        <input type="range" id="stiffness" min="1" max="500" step="1" value="120" />
      </div>
      <div class="slider-group">
        <label>Damping <span id="val-damping">12</span></label>
        <input type="range" id="damping" min="0" max="50" step="0.5" value="12" />
      </div>
      <div class="slider-group">
        <label>Mass <span id="val-mass">1.0</span></label>
        <input type="range" id="mass" min="0.1" max="10" step="0.1" value="1.0" />
      </div>
    </div>
  </div>

  <button id="btn-toggle-ui" title="Toggle Controls (H)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <div id="message" class="hidden">
    <p>Click to start webcam</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
