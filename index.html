<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webcam FX</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <div class="controls-header">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="droste">Droste</button>
        <button class="mode-tab" data-mode="pixelsort">Pixel Sort</button>
      </div>
      <div class="controls-buttons">
        <button id="btn-toggle-cam" title="Start/Stop Camera">
          <span id="cam-icon">&#9673;</span>
        </button>
        <button id="btn-toggle-anim" data-modes="droste" title="Pause/Resume Animation">
          <span id="anim-icon">&#10074;&#10074;</span>
        </button>
        <button id="btn-toggle-grid" data-modes="droste" title="Toggle Grid (G)">
          <span id="grid-icon">&#9638;</span>
        </button>
      </div>
    </div>

    <div class="select-group">
      <label>Camera</label>
      <select id="camera-select">
        <option value="">Loading cameras...</option>
      </select>
    </div>

    <!-- Droste mode controls -->
    <div class="mode-controls" data-mode="droste">
      <div class="geometry-group">
        <label>Geometry <span id="val-geometry">1, -1</span></label>
        <div class="geometry-pad" id="geometry-pad">
          <canvas id="geometry-canvas" width="200" height="200"></canvas>
          <div class="geometry-point" id="geometry-point"></div>
        </div>
      </div>

      <div class="slider-group">
        <label>Zoom <span id="val-zoom">0.30</span></label>
        <input type="range" id="zoomSpeed" min="0" max="2.0" step="0.01" value="0.30" />
      </div>

      <div class="spring-section">
        <label class="section-label">Spring</label>
        <div class="slider-group">
          <label>Stiffness <span id="val-stiffness">120</span></label>
          <input type="range" id="stiffness" min="1" max="500" step="1" value="120" />
        </div>
        <div class="slider-group">
          <label>Damping <span id="val-damping">12</span></label>
          <input type="range" id="damping" min="0" max="50" step="0.5" value="12" />
        </div>
        <div class="slider-group">
          <label>Mass <span id="val-mass">1.0</span></label>
          <input type="range" id="mass" min="0.1" max="10" step="0.1" value="1.0" />
        </div>
      </div>
    </div>

    <!-- Pixel Sort mode controls -->
    <div class="mode-controls" data-mode="pixelsort" style="display: none;">
      <div class="slider-group">
        <label>Threshold <span id="val-threshold">0.50</span></label>
        <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.50" />
      </div>

      <div class="select-group no-border">
        <label>Direction</label>
        <select id="sort-direction">
          <option value="0">Horizontal</option>
          <option value="1" selected>Vertical</option>
        </select>
      </div>

      <div class="slider-group">
        <label>Intensity <span id="val-intensity">32</span></label>
        <input type="range" id="sort-intensity" min="0" max="100" step="1" value="30" />
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="sort-reverse" />
          <span>Reverse sort order</span>
        </label>
      </div>
    </div>
  </div>

  <button id="btn-toggle-ui" title="Toggle Controls (H)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <div id="message" class="hidden">
    <p>Click to start webcam</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
